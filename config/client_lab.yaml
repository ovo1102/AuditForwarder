# AuditForwarder - 合谋实验专用客户端配置
#
# 与 config/client_windows.yaml 的区别：
#   1. 服务端指向本机 127.0.0.1:8443（实验环境自建，不连远程联调机）
#   2. 打开 HTTP 代理采集器，只采集图书管理系统的流量
#   3. 打开身份提取：操作员从请求里解析，而不是取下面写死的 operator.id
#
# 用法：build\Release\auditforwarder-client.exe -c config/client_lab.yaml
# 必须在仓库根目录运行，否则日志路径与数据目录解析不到。

agent:
  id: "lab-pc"
  data_dir: data/client
  config_path: config/client_lab.yaml

# 默认操作员：仅当请求里解析不出身份时兜底（例如 HTTPS 隧道、非浏览器脚本）
operator:
  id: "admin"
  name: "admin"

log:
  level: info
  file: data/client/client.log
  max_bytes: 52428800
  max_backups: 5

chain:
  batch_size: 128                     # 每秒产生的采集事件可达数百条，1 条/批会瞬间堵死队列
  sign_batches: false
  # 不要开 auto_persist：落盘会写 data/client/batches/*.json，而 file_win 采集器
  # 会把这些写入再采集成新事件，形成「采集→上送→落盘→再采集」的正反馈。
  # 实测该回路能让队列以每秒数百批的速度增长，最终积压 28 万个批次文件，
  # 真实业务事件（如手动验证的 R-002 三步）永远排不到队首。
  auto_persist: false
  hmac_key: ""

transport:
  servers:
    - "http://127.0.0.1:8443/ingest?agent=lab-pc"
  mode: realtime
  interval_sec: 1
  compress: false
  encrypt_payload: false
  auth_token: ""
  verify_tls: false

remote:
  enabled: true
  servers:
    - "http://127.0.0.1:8443"
  host_id: "lab-pc"
  heartbeat_interval_sec: 5
  command_poll_interval_sec: 3
  audit_summary_interval_sec: 1     # 实验环境压到 1 秒：操作日志越快进服务端，合谋告警越快出
  production_mode: false
  require_tls: false
  crl_check: false
  enrollment_key: ""
  allowed_commands:
    - collect_status
    - echo
    - set_collector
    - set_collectors
    - load_rules

detector:
  rules_path: config/rules.yaml
  enable_behavior_baseline: true

self_protect:
  enabled: false

manager:
  enabled: false
  auth_token: ""

collectors:
  enabled: true
  filter:
    file:
      paths: []
      include: []
      exclude: []
      coalesce_ms: 0
    process:
      exclude_images: ["*"]        # 只用 http_proxy，进程事件是噪音且会堵上报队列
      emit_exit: false
    network:
      include_loopback: true          # 实验系统在本机，必须保留回环连接
      only_established: true
      emit_only_new: true
      poll_ms: 30000                # 网络快照降到 30 秒一次，减少无意义事件
      exclude_remote_ports: []
    etw:
      event_ids: [4624, 4625, 4688]
      logon_types: [2, 10, 11]
      skip_machine_accounts: true
      skip_system: true
      extract_command_line: true
  http_proxy:
    enabled: true
    bind: 127.0.0.1
    listen_port: 8888
    capture_body: true                # exec 类接口的动作名在请求体里，必须留 body
    # 只采图书管理系统，避免整机流量淹没证据。
    # 注意必须写成行内数组（[...]）：本项目自带的 YAML 解析器不认块序列（每行一个 "- 值"），
    # 写成块序列会被静默丢成空列表，而空列表的含义是「采集所有主机」。
    # 局域网联调时必须把图书系统所在机器的 IP 也加进来，否则对方浏览器
    # 访问 http://<IP>:18080 的请求会被整条丢弃，服务端一条都收不到。
    # 注意：host_allowed() 会丢掉端口，只比主机名，所以写不写 :18080 都一样。
    # 注意：浏览器（Chromium 内核）对 127.0.0.1 / localhost 有无条件直连规则
    # （implicit bypass），不走系统代理，因此浏览器手动验证必须用本机 LAN IP 访问。
    #
    # 不要把 127.0.0.1 / localhost 列进来：系统代理开启后，本机大量程序会把
    # 127.0.0.1:8888 本身当作请求目标，这些环回请求会被当成业务流量采集，
    # 与上传写盘产生的文件事件叠加，形成「采集→上传→写文件→再采集」的放大回路，
    # 队列以每秒数百条的速度增长，真正的业务事件永远排不到前面。
    target_hosts: ["10.4.26.254", "10.4.55.6"]
    # 操作员身份提取：决定"这条日志是谁做的"
    # 一台机器上多个管理员轮流操作时，只有这样才能区分操作员。
    identity:
      header: "x-af-operator"         # 1. 显式身份头（curl / 脚本直接声明）
      cookie: "af_operator"           # 2. 登录后下发的身份 Cookie
      from_bearer: true               # 3. 解 Authorization: Bearer <token> 里的 username
      from_body: true                 # 4. 登录请求体里的 username

privilege_detect:
  enabled: true

test_injection:
  enabled: false
  interval_ms: 1000

processors:
  - type: enricher
  - type: pii_masker
  - type: deduper
    window_ms: 50
