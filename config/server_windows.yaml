# AuditForwarder - Windows 服务端测试配置

agent:
  id: "auditforwarder-server"
  data_dir: data/server
  config_path: config/server_windows.yaml

log:
  level: debug
  file: data/server/server.log
  max_bytes: 52428800
  max_backups: 5

chain:
  batch_size: 10
  sign_batches: false
  auto_persist: true
  hmac_key: ""                      # 客户端 chain.hmac_key 必须与此一致，服务端据此验签（双方为空则跳过验签）

transport:
  servers: []
  auth_token: ""
  verify_tls: false

remote:
  enabled: false
  servers: []

detector:
  rules_path: config/rules.yaml
  enable_behavior_baseline: false

self_protect:
  enabled: false

manager:
  enabled: true
  listen: 0.0.0.0:8443
  auth_token: ""
  login_username: "admin"
  enrollment_key: ""                # 注册密钥，请自行配置并与客户端 remote.enrollment_key 保持一致
  # Web 登录密码为 SHA256 哈希（明文密码不落盘）。占位值非空以禁用内置默认口令；
  # 请替换为你自己的强密码哈希，生成方法（PowerShell）：
  #   $b=[Text.Encoding]::UTF8.GetBytes("你的密码"); -join ([Security.Cryptography.SHA256]::Create().ComputeHash($b) | % { $_.ToString("x2") })
  # 明文密码 = admin123（仅用于本地开发调试，生产部署请改为强密码的 SHA256）
  # login_password_sha256 留空 = 使用默认 admin/admin123；已删除硬编码 hash 避免兼容问题
  status_timeout_seconds: 30       # 心跳超过此值判定下线（客户端默认 5s 心跳，留 6 次窗口）
  use_tls: false
  require_client_cert: false
  tls_crl_check: false

storage:
  time_partition: true              # 按天分片：<类型>/<YYYY-MM-DD>/ 目录
  archive_enabled: true             # 启用冷热归档（热区 → archive/ → 超期删除）
  hot_days: 7                       # 热区保留天数，超过移入 archive/
  archive_days: 180                 # 归档保留天数，超过删除
  db_retention_days: 180            # 每主机 SQLite（hosts/<id>/host.db）保留天数，<=0 关闭
  # 单类型覆盖（不写则跟随上面的全局值）；granularity: day | month
  types:
    operation_logs:
      granularity: day
      hot_days: 7
      archive_days: 180
    host_metrics:
      granularity: day
      hot_days: 7
      archive_days: 180
    alerts:
      granularity: day
      hot_days: 30
      archive_days: 180
    audit_summaries:
      granularity: month
      hot_days: 30
      archive_days: 365
    command_results:
      granularity: month
      hot_days: 30
      archive_days: 180

collectors:
  enabled: false

processors:
  - type: enricher
